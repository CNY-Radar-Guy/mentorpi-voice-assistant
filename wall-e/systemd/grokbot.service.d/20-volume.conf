[Service]
# robot voice over track noise (80% of max); was 45%
ExecStartPre=-/usr/bin/amixer -q -c Device sset Speaker 80%
# 2026-11-26 voicefix: WonderEcho capture 90% (was 83%). Mic playback stays muted at 2%.
ExecStartPre=-/usr/bin/amixer -q -c Device sset Mic cap 90%
ExecStartPre=-/usr/bin/amixer -q -c Device sset Mic playback 2%
ExecStartPre=-/usr/bin/amixer -q -c Device sset Mic playback off
